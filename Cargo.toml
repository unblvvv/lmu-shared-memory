[package]
name = "lmu-shared-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Safe Rust reader for Le Mans Ultimate shared memory telemetry and standings"
license = "MIT"
documentation = "https://docs.rs/lmu-shared-memory"
readme = "README.md"
keywords = ["le-mans-ultimate", "telemetry", "sim-racing", "shared-memory"]
categories = ["api-bindings", "games"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
